services:
  db:
    image: postgres:16-alpine
    container_name: techexpert-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techexpert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techexpert}
      POSTGRES_DB: ${POSTGRES_DB:-techexpert}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techexpert} -d ${POSTGRES_DB:-techexpert}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: techexpert-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-techexpert}:${POSTGRES_PASSWORD:-techexpert}@db:5432/${POSTGRES_DB:-techexpert}
      PROLOG_KB_PATH: /app/prolog/knowledge_base.pl
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./prolog:/app/prolog:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: techexpert-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:

